<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>InkOnEarth</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="routes.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { height: 100vh; width: 100vw; background: #f8fafc; }
    
    #control-panel {
      position: absolute; top: 20px; left: 20px; z-index: 1000;
      background: rgba(255, 255, 255, 0.95); padding: 8px 16px;
      border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      display: flex; gap: 12px; align-items: center; font-size: 13px;
    }
    .btn { 
      padding: 6px 14px; border: none; border-radius: 6px; 
      cursor: pointer; font-weight: 500; transition: all 0.2s;
    }
    .play-btn { background: #0066ff; color: white; }
    .play-btn:hover { background: #0052cc; }
    .clear-btn { background: #f1f5f9; color: #475569; }
    .clear-btn:hover { background: #e2e8f0; }

    #status { color: #64748b; min-width: 100px; }
    #status b { color: #0066ff; }
  </style>
</head>
<body>
  <div id="control-panel">
    <button id="playBtn" class="btn play-btn" onclick="startWritingAnimation()">开始书写</button>
    <button class="btn clear-btn" onclick="resetCanvas()">清空</button>
    <div id="status">就绪</div>
  </div>
  
  <div id="map"></div>

  <script src="js/app.js"></script>
</body>
</html>
