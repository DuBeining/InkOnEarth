<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>InkOnEarth</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { height: 100vh; width: 100vw; }
    
    #control-panel {
      position: absolute; top: 20px; left: 60px; z-index: 1000;
      background: rgba(255, 255, 255, 0.96); padding: 10px 14px;
      border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      display: flex; gap: 8px; align-items: center;
    }
    input { 
      padding: 8px 12px; border: 1px solid #dcdfe6; border-radius: 6px; 
      width: 110px; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: #0066ff; }
    
    .swap-btn {
      background: #f2f3f5; border: 1px solid #e5e6eb; border-radius: 6px;
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 14px; color: #4e5969; transition: all 0.2s;
    }
    .swap-btn:hover { background: #e5e6eb; color: #1d2129; transform: rotate(180deg); }
    
    .btn { 
      padding: 8px 14px; border: none; border-radius: 6px; 
      cursor: pointer; font-weight: 500; transition: background 0.2s;
    }
    .draw-btn { background: #0066ff; color: white; }
    .draw-btn:hover { background: #0052cc; }
    .draw-btn:disabled { background: #a0cfff; cursor: not-allowed; }
    
    .load-btn { background: #10b981; color: white; }
    .load-btn:hover { background: #059669; }

    .divider { width: 1px; height: 24px; background: #e5e6eb; margin: 0 4px; }
  </style>
</head>
<body>
  <div id="control-panel">
    <input id="startInput" placeholder="起点城市" value="Paris" />
    <button class="swap-btn" title="反转起终点" onclick="swapCities()">⇄</button>
    <input id="endInput" placeholder="终点城市" value="Berlin" />
    <button id="drawBtn" class="btn draw-btn" onclick="handleAddRoute()">绘制航线</button>

    <div class="divider"></div>

    <button class="btn load-btn" onclick="loadAndRenderHanziRoutes()">Load Files</button>
  </div>
  
  <div id="map"></div>

  <script src="js/app.js"></script>
</body>
</html>
